onboarding = false

[keys]
# herdr setting
next_workspace = "prefix+]"
previous_workspace = "prefix+["
# herdr setting: shifted punctuation is bound as the literal character
next_agent = "prefix+}"
previous_agent = "prefix+{"

# plugin: file-viewer
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "open file viewer in split"

# plugin: file-viewer
[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "open file viewer in tab"

# feature: stack-pane
[[keys.command]]
key = "prefix+m"
type = "shell"
command = "$HOME/.config/herdr/scripts/stack-pane.sh"
description = "stack pane under its left neighbour / unstack"

# feature: sidebar-layout (the $last_tool row comes from feature: last-tool)
[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace"],
  [{ token = "terminal_title_stripped", bold = true }],
  [{ token = "$last_tool", dim = true }],
]
